{{ define "main" }}
<div class="sub-hero">
  <h1>{{ .Title }}</h1>
</div>
<div class="section">
  {{ .Content }}
  <div class="grid-3">
    {{ range .Pages }}
    <div class="card">
      <h3><a href="{{ .RelPermalink }}" style="color:var(--ink);text-decoration:none;">{{ .Title }}</a></h3>
      <p>{{ .Summary }}</p>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
